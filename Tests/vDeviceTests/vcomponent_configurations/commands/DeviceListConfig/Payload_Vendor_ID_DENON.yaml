HdmiCec:
  command: "cec_message"
  description: "Trigger process(DeviceVendorID) from DENON (LA=1, RecordingDevice, port 1 of the audio system) - vendor 0x0009B0"
  message:
    user_defined: true
    # Header 0x1F: initiator=1 (DENON, Recording Device 1), destination=0xF (broadcast).
    #       DENON IS ADDRESS 1, NOT 2 - the same rule as the sibling SetOSDName document.  The
    #       initiator nibble MUST equal the logical address PEER_SEEDS assigns DENON, which
    #       ../Device_Config_Add_Network.yaml fixes at 1: DENON is declared LAST among YAMAHA's
    #       children, is therefore visited FIRST by vcDevice_AllocatePhysicalLogicalAddresses and
    #       takes RECORDINGDEVICE1, while LG is visited last and takes RECORDINGDEVICE2.  Writing
    #       0x2F here files DENON's vendor identifier against LG's device-list entry and leaves
    #       DENON's vendor field empty; verify_seed_payload_consistency() refuses it first.
    #       BROADCAST, matching this peer's ReportPhysicalAddress payload: the destination nibble
    #       0xF is load-bearing, because process(DeviceVendorID) returns early for anything that is
    #       not a broadcast (HdmiCecSinkImplementation.cpp:380-383).
    # Opcode 0x87: DeviceVendorID  Denon vendor ID 0x0009B0
    payload: ["0x1F", "0x87", "0x00", "0x09", "0xB0"]
