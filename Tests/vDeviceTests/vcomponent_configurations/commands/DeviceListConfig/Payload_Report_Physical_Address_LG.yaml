HdmiCec:
  command: "cec_message"
  description: "Trigger process(ReportPhysicalAddress) from LG (LA=2, RecordingDevice, port 3 of the audio system)"
  message:
    user_defined: true
    # Header 0x2F: initiator=2 (LG, Recording Device 2), destination=0xF (broadcast)
    # Opcode 0x84: ReportPhysicalAddress
    # Physical 2.3.0.0 -> 0x23,0x00, device_type RecordingDevice=0x01
    payload: ["0x2F", "0x84", "0x23", "0x00", "0x01"]
