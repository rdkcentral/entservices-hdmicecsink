HdmiCec:
  command: "cec_message"
  description: "Trigger process(ReportPhysicalAddress) from DENON (LA=1, RecordingDevice, port 1 of the audio system)"
  message:
    user_defined: true
    # Header 0x1F: initiator=1 (DENON, Recording Device 1), destination=0xF (broadcast)
    # Opcode 0x84: ReportPhysicalAddress
    # Physical 2.1.0.0 -> 0x21,0x00, device_type RecordingDevice=0x01
    payload: ["0x1F", "0x84", "0x21", "0x00", "0x01"]
