HdmiCec:
  command: "cec_message"
  description: "Trigger process(DeviceVendorID) from SONY (LA=4) - vendor 0x080046"
  message:
    user_defined: true
    # Header 0x4F: initiator=4 (SONY, Playback Device 1), destination=0xF (broadcast)
    # Opcode 0x87: DeviceVendorID  Sony vendor ID 0x080046
    payload: ["0x4F", "0x87", "0x08", "0x00", "0x46"]
