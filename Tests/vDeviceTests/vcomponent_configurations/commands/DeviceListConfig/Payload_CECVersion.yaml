# THE ONE AUTHORITATIVE TOPOLOGY lives in ../Device_Config_Add_Network.yaml. Every address in
# this document is copied from the derivation table in that file's header and from nowhere else:
#
#   peer       device_type      parent  port  physical  logical
#   ---------  ---------------  ------  ----  --------  -------
#   SAMSUNG    Tuner            VTV      1    1.0.0.0      3
#   YAMAHA     AudioSystem      VTV      2    2.0.0.0      5
#   SONY       PlaybackDevice   VTV      3    3.0.0.0      4
#   DENON      RecordingDevice  YAMAHA   1    2.1.0.0      1
#   PANASONIC  PlaybackDevice   YAMAHA   2    2.2.0.0      8
#   LG         RecordingDevice  YAMAHA   3    2.3.0.0      2
#
# A logical address, a physical address or a device type changed here without the same change in
# the network document leaves two files describing different devices, and the drift is not inert:
# an operand carried by <Report Physical Address> is written straight into
# deviceList[la].m_physicalAddr (HdmiCecSinkImplementation.cpp:366-367), so a stale operand MOVES
# the peer rather than merely reading wrong.
#
# <CEC Version> from the bootstrap peer, posted as an idempotent confirmation once its seed
# triplet has landed.
HdmiCec:
  command: "cec_message"
  description: "Trigger process(CECVersion) from YAMAHA (LA=5, Audio System) - CEC 1.4"
  message:
    user_defined: true
    # 0x50  header: initiator 5 (YAMAHA), destination 0 - the sink television. DIRECTED,
    #       because <CEC Version> is the reply to a directed <Get CEC Version>
    #       (HdmiCecSinkImplementation.cpp:208-228 sends it with conn.sendToAsync(header.from, ...)),
    #       and a reply addressed to the whole bus would describe a frame no device asked for.
    #       process(CECVersion) (cpp:229-239) itself accepts either addressing; the directed form is
    #       used because it is the one the protocol produces.
    # 0x9E  opcode <CEC Version>.
    # 0x05  Version::V_1_4. process(CECVersion) re-enters addDevice() for address 5 and then
    #       records the version on that entry, which getDeviceList reports as "cecVersion" - so this
    #       frame carries no new field of its own and is safe to post more than once.
    payload: ["0x50", "0x9E", "0x05"]
