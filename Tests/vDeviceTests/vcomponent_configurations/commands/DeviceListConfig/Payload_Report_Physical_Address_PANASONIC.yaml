# THE ONE AUTHORITATIVE TOPOLOGY lives in ../Device_Config_Add_Network.yaml. Every address in
# this document is copied from the derivation table in that file's header and from nowhere else:
#
#   peer       device_type      parent  port  physical  logical
#   ---------  ---------------  ------  ----  --------  -------
#   SAMSUNG    Tuner            VTV      1    1.0.0.0      3
#   YAMAHA     AudioSystem      VTV      2    2.0.0.0      5
#   SONY       PlaybackDevice   VTV      3    3.0.0.0      4
#   DENON      RecordingDevice  YAMAHA   1    2.1.0.0      1
#   PANASONIC  PlaybackDevice   YAMAHA   2    2.2.0.0      8
#   LG         RecordingDevice  YAMAHA   3    2.3.0.0      2
#
# A logical address, a physical address or a device type changed here without the same change in
# the network document leaves two files describing different devices, and the drift is not inert:
# an operand carried by <Report Physical Address> is written straight into
# deviceList[la].m_physicalAddr (HdmiCecSinkImplementation.cpp:366-367), so a stale operand MOVES
# the peer rather than merely reading wrong.
#
# <Report Physical Address> announcing PANASONIC to the sink television.
HdmiCec:
  command: "cec_message"
  description: "Trigger process(ReportPhysicalAddress) from PANASONIC (LA=8, Playback Device) at 2.2.0.0"
  message:
    user_defined: true
    # Raw frame, injected byte for byte. The vComponent synthesises operands only for
    # <Active Source>, <Inactive Source> and <Set OSD Name> (vcHdmiCec.c ParseCommand), so a
    # <Report Physical Address> has to spell its own out.
    #
    # 0x8F  header: initiator 8 (PANASONIC), destination 0xF (broadcast).
    #       process(ReportPhysicalAddress) discards directed frames outright
    #       (HdmiCecSinkImplementation.cpp:351-353), so broadcast is not a stylistic choice.
    # 0x84  opcode <Report Physical Address>.
    # 0x22, 0x00  physical address 2.2.0.0, which is what ../Device_Config_Add_Network.yaml
    #       allocates to this peer (YAMAHA, port 2). Two wire bytes of four nibbles - byte 0
    #       is n0<<4|n1, byte 1 is n2<<4|n3 (Operands.hpp PhysicalAddress).
    # 0x04  device type Playback Device, the family logical address 8 belongs to
    #       (Operands.hpp LogicalAddress::getType). process(ReportPhysicalAddress) stores this byte
    #       verbatim into deviceList[8].m_deviceType (cpp:367) and getDeviceList reports it, so an
    #       address paired with a device type it cannot hold is observable through the published
    #       API.
    payload: ["0x8F", "0x84", "0x22", "0x00", "0x04"]
